# Header bảo mật, include trong từng location: add_header ở location làm mất add_header của server
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Chỉ trang của mình được xin quyền micro (ghi âm Speaking), tắt camera và vị trí
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
